name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded ordinary PR checks, never main pushes or other workflows.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: python3 scripts/check-release-versions.py
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      # Tracked source must not cite the untracked design docs or their opaque
      # F-/D-/R- identifiers: neither resolves in a clone, so the reference is
      # dead for everyone but the author. CHANGELOG.md is exempt as released
      # history; eval/tasks/*.json are byte-exact fixtures whose synthetic
      # content legitimately contains id-shaped strings.
      - name: no references to untracked design docs
        run: |
          if git grep -nE 'docs/solution-design|\b(INTERFACES|ENGINEERING|ROADMAP|PLAN|ARCHITECTURE|TOUCHPOINTS)\.md|\b(roadmap|plan|interfaces|engineering|model-research|architecture|touchpoints|compression-ideas|lossy-json-compression)\.md|\b[FDR]-[0-9]{3}\b' \
               -- $(git ls-files) ':!CHANGELOG.md' ':!.gitignore' ':!.github/workflows/ci.yml' ':!eval/tasks/**/*.json'; then
            echo "::error::Found a reference to an untracked design document or an opaque F-/D-/R- id."
            echo "Replace it with prose describing the behaviour, or point at a tracked file."
            exit 1
          fi

  test:
    name: test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  windows-smoke:
    name: windows-smoke
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo test -p tokenfold-cli -p tokenfold-proxy --locked

  python-wheel:
    name: python-wheel (Python 3.12)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --locked --out dist -m crates/tokenfold-py/Cargo.toml
          manylinux: auto
      - run: python -m pip install pytest dist/*.whl
      - run: python -m pytest python-tests -q
      - uses: actions/upload-artifact@v7
        with:
          name: python-abi3-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  select-runtime-contracts:
    name: select-runtime-contracts (${{ matrix.os }}, Python 3.12)
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Installed CPU/mock contracts only; no weights, PyTorch or inference.
      - run: python -m pip install setuptools==78.1.0 numpy==2.5.3
      - run: python -m pip install --no-deps --no-build-isolation ./packages/tokenfold-select
      - run: python -I -m unittest discover -s "${{ github.workspace }}/packages/tokenfold-select/tests" -v
        working-directory: ${{ runner.temp }}

  python-abi3-smoke:
    name: python-abi3-smoke (Python ${{ matrix.python }})
    timeout-minutes: 10
    needs: python-wheel
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: python-abi3-wheel
          path: dist
      - run: python -m pip install dist/*.whl
      - run: python -c "import tokenfold; assert tokenfold.Preset.BALANCED"

  linux-binaries:
    name: linux-binaries
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked -p tokenfold-cli -p tokenfold-proxy
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: |
            target/release/tokenfold
            target/release/tokenfold-proxy
          if-no-files-found: error
          retention-days: 1

  node-api:
    name: node-api (Node ${{ matrix.node }})
    timeout-minutes: 10
    needs: linux-binaries
    if: ${{ !cancelled() }}
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Linux build
        env:
          LINUX_BUILD_RESULT: ${{ needs.linux-binaries.result }}
        run: test "$LINUX_BUILD_RESULT" = success
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/tokenfold/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: target/release
      - run: chmod +x target/release/tokenfold target/release/tokenfold-proxy
      - run: npm ci
        working-directory: packages/tokenfold
      - run: npm test
        working-directory: packages/tokenfold
        env:
          TOKENFOLD_TEST_BINARY: ${{ github.workspace }}/target/release/tokenfold

  coverage:
    name: coverage
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 1

  golden-cross-platform:
    name: golden-cross-platform
    timeout-minutes: 10
    strategy:
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked -- golden

  # CI gate policy: blocking on pull requests and on push to main.
  security:
    name: security
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the secret scan below is only meaningful if it can see
          # every commit, not just the tip.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo audit
      - run: cargo deny check advisories bans licenses sources
      # This repo publishes to crates.io, PyPI, npm and GitHub Releases, so a
      # leaked token is a four-registry problem. Scans full history, not just
      # the diff, and is blocking on push to main like the rest of this job.
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  # CI gate policy: advisory on merge (gross-regression check only; bench-regression on a
  # dedicated runner is the release-blocking gate — see release.yml).
  bench-smoke:
    name: bench-smoke
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo bench --workspace --locked

  # CI gate policy: advisory on merge; deterministic-bootstrap scorer (no live LLM judge
  # / API key needed yet — see eval/tasks/FIXTURES.md), so this can safely run on every PR too.
  fidelity-smoke:
    name: fidelity-smoke
    timeout-minutes: 10
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - run: python eval/run_fidelity.py --gate --profile smoke-first-consumer

  # Evaluation-evidence repair: the lossy adapter is migrated to the shipped v0.5
  # --prune/--keep-ratio/--preserve flags (contract tests guard the harness), and the
  # human quality audit must be complete and non-stale (--check) before merging.
  eval-harness:
    name: eval-harness
    timeout-minutes: 10
    needs: linux-binaries
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      TOKENFOLD_LEARNED_MODULE: json
      TOKENFOLD_BIN: ${{ github.workspace }}/target/release/tokenfold
      TOKENFOLD_PROXY_BIN: ${{ github.workspace }}/target/release/tokenfold-proxy
    steps:
      - name: Require successful Linux build
        env:
          LINUX_BUILD_RESULT: ${{ needs.linux-binaries.result }}
        run: test "$LINUX_BUILD_RESULT" = success
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: target/release
      - run: chmod +x target/release/tokenfold target/release/tokenfold-proxy
      - run: python eval/test_baseline_fixture_contract.py
      - run: python eval/test_baseline_cli.py
      - run: python eval/test_paired_runner.py
      - run: python eval/test_audit_quality_sample.py
      - run: python eval/run_baselines.py --gate
      - run: python eval/audit_quality_sample.py --check
