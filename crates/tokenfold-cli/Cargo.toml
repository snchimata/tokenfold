[package]
name = "tokenfold-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable CLI for token-aware compression of LLM payloads."
keywords = ["cli", "llm", "compression", "tiktoken", "token-optimization"]
categories = ["command-line-utilities", "compression"]

[[bin]]
name = "tokenfold"
path = "src/main.rs"

[dependencies]
tokenfold-adapters = { version = "0.5.1", path = "../tokenfold-adapters" }
tokenfold-core = { version = "0.5.1", path = "../tokenfold-core" }
tokenfold-output = { version = "0.5.1", path = "../tokenfold-output" }
tokenfold-learn = { version = "0.5.1", path = "../tokenfold-learn" }
tokenfold-rag = { version = "0.5.1", path = "../tokenfold-rag" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
