[package]
name = "tokenfold-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Token-aware compression for LLM payloads: shrink JSON tool-call bodies, command output, and diffs with exact tiktoken accounting and a typed safety report."
readme = "README.md"
keywords = ["llm", "tokenizer", "compression", "tiktoken", "token-optimization"]
categories = ["compression", "text-processing"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
toon-format = { workspace = true }
toml = { workspace = true }
tiktoken-rs = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = ["tiktoken"]
tiktoken = ["dep:tiktoken-rs"]

[[bench]]
name = "compression_bench"
harness = false

# The example lives in the repo-root examples/ folder, beside the Python, Node, and
# CLI ones, so all four surfaces stay in one place. Out-of-root targets are not
# packaged, which is the point: the example reads fixtures this crate does not ship.
[[example]]
name = "quickstart"
path = "../../examples/quickstart.rs"

[[example]]
name = "regenerate_goldens"
path = "../../examples/regenerate_goldens.rs"
