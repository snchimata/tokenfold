<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Tokenfold decides what to fold</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#0b1020;--panel:#111d36;--ink:#f8fafc;--muted:#94a3b8;--accent:#22d3ee;--violet:#a855f7}
body{font-family:'Geist',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2.5rem 1.5rem}
.frame{max-width:1040px;width:100%}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(1.6rem,2.5vw + .8rem,2.2rem);font-weight:400;margin-bottom:.5rem}
.lede{font-size:.92rem;color:var(--muted);margin-bottom:1.5rem}
svg{width:100%;height:auto;display:block;background:var(--paper);border-radius:8px}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Architecture Flowchart</p>
<h1>How Tokenfold decides what to fold</h1>
<p class="lede">Lossless by default, lossy only when opted in, never larger than input.</p>

<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tf-title tf-desc">
<title id="tf-title">How Tokenfold decides what to fold</title>
<desc id="tf-desc">Flowchart: Detects shape (tabular, JSON schema, or heterogeneous), applies deterministic folding or opt-in pruning, verifies round-trip decode, and guards against expansion.</desc>
<defs>
  <style>
    .tf-text { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #f8fafc; }
    .tf-subtext { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; fill: #94a3b8; font-size: 10px; }
    .tf-badge { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 10.5px; font-weight: 500; }
  </style>
  <marker id="arrCyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#22d3ee"/>
  </marker>
  <marker id="arrPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#a855f7"/>
  </marker>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="#0b1020"/>

<!-- ================= CONNECTORS / EDGES ================= -->
<!-- Input -> Detect Shape -->
<line x1="480" y1="72" x2="480" y2="108" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>

<!-- Branch 1 (Left): Tabular Array -->
<path d="M 390 144 H 208 Q 200 144 200 152 V 206" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>

<!-- Branch 2 (Center): JSON Schema -->
<line x1="480" y1="180" x2="480" y2="206" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>

<!-- Branch 3 (Right): Heterogeneous Feed -->
<path d="M 570 144 H 752 Q 760 144 760 152 V 194" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrPurple)"/>

<!-- Heterogeneous -> Opt-in Decision: Yes -->
<line x1="760" y1="272" x2="760" y2="304" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrPurple)"/>

<!-- Heterogeneous -> Opt-in Decision: No -->
<path d="M 680 236 H 640 Q 632 236 632 244 V 370 Q 632 378 624 378 H 490" fill="none" stroke="#a855f7" stroke-width="1.3"/>

<!-- Converge: Tabular Bottom -> Bus -->
<path d="M 200 262 V 370 Q 200 378 208 378 H 470" fill="none" stroke="#22d3ee" stroke-width="1.5"/>

<!-- Converge: Schema Bottom -> Bus -->
<line x1="480" y1="262" x2="480" y2="378" stroke="#22d3ee" stroke-width="1.5"/>

<!-- Converge: Pruned Feed Bottom -> Bus -->
<path d="M 760 358 V 370 Q 760 378 752 378 H 490" fill="none" stroke="#a855f7" stroke-width="1.3"/>

<!-- Bus down into Round-Trip Verify -->
<line x1="480" y1="378" x2="480" y2="408" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>

<!-- Verify -> Guard Check -->
<line x1="480" y1="462" x2="480" y2="492" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>

<!-- Guard: Yes (Smaller) -> Emit -->
<line x1="565" y1="528" x2="628" y2="528" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>

<!-- Guard: No -> Keep Compact -->
<line x1="480" y1="564" x2="480" y2="598" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrPurple)"/>

<!-- ================= CONNECTOR BADGES ================= -->
<!-- Badge: Tabular -->
<rect x="250" y="128" width="88" height="18" rx="4" fill="#0b1020" stroke="#22d3ee" stroke-width="0.8"/>
<text x="294" y="141" fill="#22d3ee" class="tf-badge" text-anchor="middle">Tabular array</text>

<!-- Badge: JSON Schema -->
<rect x="490" y="186" width="82" height="18" rx="4" fill="#0b1020" stroke="#22d3ee" stroke-width="0.8"/>
<text x="531" y="199" fill="#22d3ee" class="tf-badge" text-anchor="middle">JSON-Schema</text>

<!-- Badge: Heterogeneous -->
<rect x="620" y="128" width="124" height="18" rx="4" fill="#0b1020" stroke="#a855f7" stroke-width="0.8"/>
<text x="682" y="141" fill="#c084fc" class="tf-badge" text-anchor="middle">Heterogeneous feed</text>

<!-- Badge: Opted In (Yes) -->
<rect x="768" y="278" width="84" height="18" rx="4" fill="#0b1020" stroke="#a855f7" stroke-width="0.8"/>
<text x="810" y="291" fill="#c084fc" class="tf-badge" text-anchor="middle">Yes, opted-in</text>

<!-- Badge: Opted In (No) -->
<rect x="642" y="222" width="28" height="18" rx="4" fill="#0b1020" stroke="rgba(248,250,252,0.2)" stroke-width="0.8"/>
<text x="656" y="235" fill="#94a3b8" class="tf-badge" text-anchor="middle">No</text>

<!-- Badge: Smaller (Yes) -->
<rect x="568" y="508" width="56" height="18" rx="4" fill="#0b1020" stroke="#22d3ee" stroke-width="0.8"/>
<text x="596" y="521" fill="#22d3ee" class="tf-badge" text-anchor="middle">Yes</text>

<!-- Badge: Smaller (No) -->
<rect x="490" y="568" width="76" height="18" rx="4" fill="#0b1020" stroke="rgba(248,250,252,0.2)" stroke-width="0.8"/>
<text x="528" y="581" fill="#94a3b8" class="tf-badge" text-anchor="middle">No (equal/+)</text>

<!-- ================= NODES ================= -->

<!-- 1. Input Node -->
<rect x="380" y="28" width="200" height="44" rx="22" fill="#111d36" stroke="rgba(248,250,252,0.4)" stroke-width="1.2"/>
<text x="480" y="48" class="tf-text" font-size="12" font-weight="600" text-anchor="middle">Incoming JSON Payload</text>
<text x="480" y="62" class="tf-subtext" text-anchor="middle">Messages, tools, or feeds</text>

<!-- 2. Decision: Detect Shape? -->
<polygon points="480,108 570,144 480,180 390,144" fill="#111d36" stroke="#f8fafc" stroke-width="1.2"/>
<text x="480" y="140" class="tf-text" font-size="12" font-weight="600" text-anchor="middle">Detect</text>
<text x="480" y="155" class="tf-text" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">payload shape?</text>

<!-- 3A. Action: Fold Keys -->
<rect x="100" y="208" width="200" height="54" rx="6" fill="#111d36" stroke="#22d3ee" stroke-width="1.2"/>
<text x="200" y="231" class="tf-text" font-size="12" font-weight="600" text-anchor="middle">Fold repeated keys</text>
<text x="200" y="247" class="tf-subtext" text-anchor="middle">into columns (__tf_cols__)</text>

<!-- 3B. Action: Compact Schema -->
<rect x="380" y="208" width="200" height="54" rx="6" fill="#111d36" stroke="#22d3ee" stroke-width="1.2"/>
<text x="480" y="231" class="tf-text" font-size="12" font-weight="600" text-anchor="middle">Compact schema</text>
<text x="480" y="247" class="tf-subtext" text-anchor="middle">shorten illustrative examples</text>

<!-- 3C. Decision: Lossy Pruning Opted-in? -->
<polygon points="760,196 840,236 760,274 680,236" fill="#111d36" stroke="#a855f7" stroke-width="1.2"/>
<text x="760" y="232" class="tf-text" font-size="11.5" font-weight="600" text-anchor="middle">Lossy pruning</text>
<text x="760" y="247" class="tf-text" font-size="11" fill="#c084fc" text-anchor="middle">opted in?</text>

<!-- 3D. Action: Rank + Prune Rows -->
<rect x="660" y="306" width="200" height="52" rx="6" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="760" y="328" class="tf-text" font-size="12" font-weight="600" text-anchor="middle">Rank &amp; prune rows</text>
<text x="760" y="344" class="tf-subtext" text-anchor="middle">dropped rows stored locally</text>

<!-- 4. Action: Round-Trip Verification -->
<rect x="340" y="410" width="280" height="52" rx="6" fill="#111d36" stroke="#22d3ee" stroke-width="1.4"/>
<text x="480" y="432" class="tf-text" font-size="12.5" font-weight="600" text-anchor="middle">Verify exact round-trip</text>
<text x="480" y="449" class="tf-subtext" text-anchor="middle">in-memory decode verification</text>

<!-- 5. Decision: Smaller than input? -->
<polygon points="480,492 565,528 480,564 395,528" fill="#111d36" stroke="#f8fafc" stroke-width="1.2"/>
<text x="480" y="524" class="tf-text" font-size="12" font-weight="600" text-anchor="middle">Smaller</text>
<text x="480" y="539" class="tf-text" font-size="11" fill="#94a3b8" text-anchor="middle">than input?</text>

<!-- 6A. Output: Emit Folded -->
<rect x="630" y="504" width="230" height="48" rx="24" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.4"/>
<text x="745" y="526" class="tf-text" font-size="12" font-weight="600" text-anchor="middle">Emit folded payload</text>
<text x="745" y="541" class="tf-subtext" text-anchor="middle">+ compression receipt</text>

<!-- 6B. Output: Passthrough Compact -->
<rect x="365" y="600" width="230" height="48" rx="24" fill="#111d36" stroke="rgba(248,250,252,0.3)" stroke-width="1.2"/>
<text x="480" y="622" class="tf-text" font-size="12" font-weight="600" text-anchor="middle">Keep compact JSON</text>
<text x="480" y="637" class="tf-subtext" text-anchor="middle">zero risk — never larger</text>

<!-- ================= LEGEND ================= -->
<line x1="40" y1="662" x2="920" y2="662" stroke="rgba(248,250,252,0.12)" stroke-width="1"/>

<text x="40" y="684" fill="#94a3b8" font-size="8.5" font-family="'Geist Mono',monospace" letter-spacing="0.16em">LEGEND</text>

<rect x="110" y="675" width="22" height="12" rx="6" fill="#111d36" stroke="rgba(248,250,252,0.4)" stroke-width="1"/>
<text x="138" y="685" class="tf-subtext">Terminal</text>

<rect x="210" y="675" width="22" height="12" rx="2" fill="#111d36" stroke="#22d3ee" stroke-width="1"/>
<text x="238" y="685" class="tf-subtext">Deterministic Step</text>

<rect x="360" y="675" width="22" height="12" rx="2" fill="#111d36" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,2"/>
<text x="388" y="685" class="tf-subtext">Opt-in Lossy Prune</text>

<polygon points="520,681 528,675 536,681 528,687" fill="#111d36" stroke="#f8fafc" stroke-width="1"/>
<text x="544" y="685" class="tf-subtext">Decision Gate</text>

<line x1="640" y1="681" x2="665" y2="681" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>
<text x="674" y="685" class="tf-subtext">Lossless Path</text>

<line x1="770" y1="681" x2="795" y2="681" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrPurple)"/>
<text x="804" y="685" class="tf-subtext">Branch / Opt-in</text>

</svg>
</div>
</body>
</html>
