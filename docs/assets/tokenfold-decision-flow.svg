<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tf-title tf-desc">
<title id="tf-title">How Tokenfold decides what to fold</title>
<desc id="tf-desc">Flowchart: JSON is folded when tabular, optionally pruned when heterogeneous, verified by round-trip, emitted only when smaller.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style>
<marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#a855f7"/></marker>
<marker id="arrA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#22d3ee"/></marker>
</defs>
<rect width="100%" height="100%" fill="#0b1020"/>
<!-- edges -->
<line x1="480" y1="80" x2="480" y2="96" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrA)"/>
<path d="M392,132 H268 Q260,132 260,140 V200" fill="none" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrA)"/>
<path d="M568,132 H692 Q700,132 700,140 V188" fill="none" stroke="#a855f7" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="348" y1="224" x2="480" y2="224" stroke="#22d3ee" stroke-width="1.4"/>
<line x1="612" y1="224" x2="480" y2="224" stroke="#a855f7" stroke-width="1.2"/>
<line x1="480" y1="168" x2="480" y2="224" stroke="#22d3ee" stroke-width="1.4"/>
<line x1="480" y1="224" x2="480" y2="344" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrA)"/>
<line x1="700" y1="260" x2="700" y2="292" stroke="#a855f7" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M608,314 H548 Q540,314 540,322 V344" fill="none" stroke="#a855f7" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="480" y1="388" x2="480" y2="396" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrA)"/>
<line x1="568" y1="432" x2="624" y2="432" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrA)"/>
<line x1="480" y1="468" x2="480" y2="496" stroke="#a855f7" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="292" y="112" width="76" height="14" rx="2" fill="#0b1020"/>
<text x="330" y="123" fill="#22d3ee" font-size="10" font-family="'Geist Mono',monospace" text-anchor="middle">Tabular array</text>
<rect x="578" y="112" width="112" height="14" rx="2" fill="#0b1020"/>
<text x="634" y="123" fill="#94a3b8" font-size="10" font-family="'Geist Mono',monospace" text-anchor="middle">Heterogeneous feed</text>
<rect x="534" y="202" width="24" height="14" rx="2" fill="#0b1020"/>
<text x="546" y="213" fill="#94a3b8" font-size="10" font-family="'Geist Mono',monospace" text-anchor="middle">No</text>
<rect x="710" y="266" width="84" height="14" rx="2" fill="#0b1020"/>
<text x="752" y="277" fill="#94a3b8" font-size="10" font-family="'Geist Mono',monospace" text-anchor="middle">Yes, opted in</text>
<rect x="560" y="410" width="76" height="14" rx="2" fill="#0b1020"/>
<text x="598" y="421" fill="#22d3ee" font-size="10" font-family="'Geist Mono',monospace" text-anchor="middle">Yes, smaller</text>
<rect x="490" y="472" width="96" height="14" rx="2" fill="#0b1020"/>
<text x="538" y="483" fill="#94a3b8" font-size="10" font-family="'Geist Mono',monospace" text-anchor="middle">No, keep compact</text>
<!-- nodes -->
<rect x="400" y="40" width="160" height="40" rx="20" fill="#f8fafc" fill-opacity="0.06" stroke="#f8fafc" stroke-opacity="0.35" stroke-width="1"/>
<text x="480" y="58" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Incoming JSON</text>
<text x="480" y="72" fill="#94a3b8" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">payload</text>
<polygon points="480,96 568,132 480,168 392,132" fill="#111d36" stroke="#f8fafc" stroke-width="1"/>
<text x="480" y="130" fill="#f8fafc" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Tabular</text>
<text x="480" y="144" fill="#f8fafc" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">shape?</text>
<rect x="160" y="200" width="200" height="48" rx="6" fill="#111d36" stroke="#f8fafc" stroke-width="1"/>
<text x="260" y="222" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Fold repeated keys</text>
<text x="260" y="236" fill="#94a3b8" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">into columns</text>
<polygon points="700,188 788,224 700,260 612,224" fill="#111d36" stroke="#f8fafc" stroke-width="1"/>
<text x="700" y="222" fill="#f8fafc" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Lossy pruning</text>
<text x="700" y="236" fill="#f8fafc" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">opted in?</text>
<rect x="600" y="292" width="200" height="44" rx="6" fill="#f8fafc" fill-opacity="0.02" stroke="#f8fafc" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4,3"/>
<text x="700" y="312" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Rank + prune rows</text>
<text x="700" y="326" fill="#94a3b8" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">dropped rows stored</text>
<circle cx="480" cy="224" r="4" fill="#f8fafc"/>
<rect x="360" y="344" width="240" height="44" rx="6" fill="#111d36" stroke="#f8fafc" stroke-width="1"/>
<text x="480" y="364" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Verify exact round-trip</text>
<text x="480" y="378" fill="#94a3b8" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">decode check</text>
<polygon points="480,396 568,432 480,468 392,432" fill="#111d36" stroke="#f8fafc" stroke-width="1"/>
<text x="480" y="430" fill="#f8fafc" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Smaller</text>
<text x="480" y="444" fill="#f8fafc" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">than input?</text>
<rect x="624" y="408" width="200" height="48" rx="24" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-width="1"/>
<text x="724" y="430" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Emit folded JSON</text>
<text x="724" y="444" fill="#94a3b8" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">+ receipt</text>
<rect x="360" y="496" width="240" height="48" rx="24" fill="#f8fafc" fill-opacity="0.04" stroke="#f8fafc" stroke-opacity="0.35" stroke-width="1"/>
<text x="480" y="518" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Keep compact JSON</text>
<text x="480" y="532" fill="#94a3b8" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">never larger</text>
<line x1="40" y1="560" x2="920" y2="560" stroke="#f8fafc" stroke-opacity="0.12" stroke-width="0.8"/>
<text x="40" y="576" fill="#94a3b8" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND - SHAPE CARRIES TYPE</text>
<rect x="40" y="584" width="24" height="12" rx="6" fill="none" stroke="#f8fafc" stroke-opacity="0.35" stroke-width="1"/>
<text x="72" y="594" fill="#94a3b8" font-size="8.5" font-family="'Geist',sans-serif">Start / end</text>
<rect x="180" y="584" width="24" height="12" rx="2" fill="#111d36" stroke="#f8fafc" stroke-width="1"/>
<text x="212" y="594" fill="#94a3b8" font-size="8.5" font-family="'Geist',sans-serif">Step</text>
<polygon points="332,590 340,584 348,590 340,596" fill="#111d36" stroke="#f8fafc" stroke-width="1"/>
<text x="356" y="594" fill="#94a3b8" font-size="8.5" font-family="'Geist',sans-serif">Decision</text>
<line x1="460" y1="590" x2="488" y2="590" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrA)"/>
<text x="496" y="594" fill="#94a3b8" font-size="8.5" font-family="'Geist',sans-serif">Lossless path</text>
<line x1="620" y1="590" x2="648" y2="590" stroke="#a855f7" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="656" y="594" fill="#94a3b8" font-size="8.5" font-family="'Geist',sans-serif">Branch</text>
</svg>